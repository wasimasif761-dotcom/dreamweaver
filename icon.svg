<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / circle with safe zone margin -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Ambient Sound Waves / Crescent / Focus Circles -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer concentric sound rings -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-dasharray="12 8"/>
    <circle r="110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3.5"/>
    <circle r="80" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

    <!-- Crescent Moon / Sleep motif -->
    <path d="M 20,-45 A 50 50 0 0 0 -35 25 A 50 50 0 0 0 35 65 A 60 60 0 0 1 20 -45 Z" fill="url(#wave)" opacity="0.95"/>

    <!-- Waveform bars across center bottom -->
    <g fill="#ffffff">
      <rect x="-90" y="80" width="8" height="24" rx="4" opacity="0.4"/>
      <rect x="-70" y="65" width="8" height="40" rx="4" opacity="0.6"/>
      <rect x="-50" y="50" width="8" height="60" rx="4" opacity="0.8"/>
      <rect x="-30" y="40" width="8" height="74" rx="4" opacity="0.95"/>
      <rect x="-10" y="32" width="8" height="84" rx="4" opacity="1.0"/>
      <rect x="10" y="38" width="8" height="76" rx="4" opacity="0.95"/>
      <rect x="30" y="52" width="8" height="56" rx="4" opacity="0.8"/>
      <rect x="50" y="68" width="8" height="36" rx="4" opacity="0.6"/>
      <rect x="70" y="80" width="8" height="22" rx="4" opacity="0.4"/>
    </g>

    <!-- Star / spark sparkles -->
    <circle cx="55" cy="-60" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="85" cy="-25" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="-65" cy="-55" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
